name: Build Kingdom Fabric Mod

on:
  push:
    paths:
      - 'RoyalVillagerKingdom-1794744662844.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_ZIP: RoyalVillagerKingdom-1794744662844.zip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extract mod project
        run: |
          test -f "$SOURCE_ZIP" || { echo "Missing $SOURCE_ZIP in repository root"; exit 1; }
          mkdir -p mod-project
          unzip -q "$SOURCE_ZIP" -d mod-project
          BUILD_FILE="$(find mod-project -name build.gradle -type f -print -quit)"
          test -n "$BUILD_FILE" || { echo "No build.gradle found in uploaded ZIP"; exit 1; }
          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Gradle project at: $PROJECT_DIR"

      - name: Build mod JAR
        run: gradle -p "$PROJECT_DIR" build --no-daemon

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: kingdom-fabric-mod
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
          if-no-files-found: error
